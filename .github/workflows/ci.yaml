name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yaml"
      - ".pre-commit-config.yaml"
      - "mise.toml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yaml"
      - ".pre-commit-config.yaml"
      - "mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"

jobs:
  prek:
    name: Prek hooks (lint/format/spell/type)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Run prek
        run: mise run hooks

  matrix:
    name: Set Python test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      python-versions: ${{ steps.set.outputs.versions }}
    steps:
      - name: Determine Python versions
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo 'versions=["3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'versions=["3.11","3.14"]' >> "$GITHUB_OUTPUT"
          fi

  pytest:
    name: Tests ${{ matrix.os }} / py${{ matrix.python }}
    needs: [prek, matrix]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ${{ fromJSON(needs.matrix.outputs['python-versions']) }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python }}
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Running package tests
        run: uv run --locked pytest --cov-report=xml

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  package:
    name: Package smoke test
    needs: pytest
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build and install wheel
        run: |
          uv build
          python -m venv pkgtest
          source pkgtest/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import r2x_core as m; print(getattr(m, '__version__', 'OK'))"
