name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build and deploy docs
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.9.4"

      - name: Install the project
        run: uv sync --group docs --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: npm ci --prefix docs

      - name: Build Astro documentation and API contracts
        run: npm run build --prefix docs

      - name: Verify static output
        run: |
          test -s docs/dist/index.html
          test -s docs/dist/references/api/index.html
          test -s docs/dist/pagefind/pagefind-entry.json

      - name: Store documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation
          path: docs/dist/
          if-no-files-found: error

  deploy:
    name: Deploy docs
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # required to publish the built documentation to gh-pages
    steps:
      - name: Download documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: documentation
          path: docs/dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/dist/
          force_orphan: true
