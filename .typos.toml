# Typos configuration for r2x-core
# See https://github.com/crate-ci/typos for more information
[files]
extend-exclude = ["tests/*"]

[default.extend-words]
# Sphinx reports directive option name.
packageid = "packageid"
# Pydantic core schema function name (not a typo)
ser = "ser"
# Fixed operations and maintenance cost column in power-systems inputs
fom = "fom"
# Compressed air energy storage technology code.
CAES = "CAES"
