[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "r2x-core"
version = "0.9.0"
description = "Shared Python infrastructure for power-system model translators"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
  { name = "pesap", email = "pesap@users.noreply.github.com" },
  { name = "kodiobika", email = "kodiobika@users.noreply.github.com" },
  { name = "Vivienne Liu", email = "vivienne.liu@nrel.gov" },
  { name = "Micah Webb", email = "micahpw@user.noreply.github.com" },
  { name = "Kinshuk Panda", email = "7632244+k1nshuk@users.noreply.github.com" },
  { name = "mcllerena", email = "mcllerena@users.noreply.github.com" },
  { name = "jarry7", email = "27745389+jarry7@users.noreply.github.com" },
]
maintainers = [
  { name = "pesap", email = "pesap@users.noreply.github.com" },
  { name = "mcllerena", email = "mcllerena@users.noreply.github.com" },
  { name = "jarry7", email = "27745389+jarry7@users.noreply.github.com" },
  { name = "kodiobika", email = "kodiobika@users.noreply.github.com" },
]
keywords = [
  "power-systems",
  "energy-modeling",
  "model-translation",
  "reeds",
  "plexos",
  "switch",
  "sienna",
  "plugin-architecture",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "h5py>=3.13.0,<4.0.0",
  "infrasys>=1.0.0,<2.0.0",
  "loguru>=0.7.3,<0.8.0",
  "packaging>=24.0,<26.0",
  "polars>=1.44.1,<2.0.0",
  "pydantic>=2.11.9,<3.0.0",
  "rust-ok>=0.3.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/NatLabRockies/r2x-core"
Documentation = "https://natlabrockies.github.io/r2x-core/"
Repository = "https://github.com/NatLabRockies/r2x-core"
Issues = "https://github.com/NatLabRockies/r2x-core/issues"
Changelog = "https://natlabrockies.github.io/r2x-core/CHANGELOG.html"

[dependency-groups]
dev = [
  "h5py-stubs>=0.1.2,<1.0.0",
  "pytest>=8.4.2,<10.0.0",
  "pytest-benchmark>=5.3.0,<6.0.0",
  "pytest-coverage>=0.0,<1.0.0",
  "pytest-xdist>=3.8.0,<4.0.0",
  "ruff>=0.13.2,<0.15.0",
  "ty>=0.0.12,<1.0.0",
]

docs = [
  "docstr-coverage>=2.3.2,<3.0.0",
]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov=r2x_core", "--cov-report=term-missing"]
markers = [
  "core: Shared error, validation, and smoke-test behavior",
  "plugin: Plugin classes, configuration, exposed transforms, and contexts",
  "rules: Rule models, filters, getters, and execution",
  "readers: DataFile configuration and file decoding",
  "processing: JSON and tabular data transformations",
  "ingestion: Source assembly and system construction from input data",
  "table_mapping: Table-mapping schemas and execution",
  "units: Unit specifications, conversion, and per-unit models",
  "time_series: Time-series ingestion, translation, and persistence",
  "system: System and component construction, serialization, and storage",
  "versioning: Version detection and upgrade behavior",
  "logging: Logging configuration and output",
  "docs: Documentation examples, coverage, and link checks",
  "polars: tests exercising Polars-backed table decoding or processing",
  "doc_coverage: Public API documentation coverage checks",
]

[tool.ruff]
line-length = 110
extend-exclude = [".venv", "venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
  "D",    # pyddoc
  "E",    # pycodestyle errors
  "EM",   # flake8-errmsg
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PIE",  # flake8-pie
  "PERF", # perflint (performance)
  "RUF",  # ruff-specific rules
]
ignore = [
  "E501", # Line too long (handled by formatter)
  "B027", # Empty method in abstract class without @abstractmethod (intentional for hooks)
]


[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Ignore `D` rules everywhere except for the `src/` directory.
"!src/**.py" = ["D", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["r2x_core"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity threshold
max-complexity = 10

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
  "@abstract",
]
precision = 2
fail_under = 98
